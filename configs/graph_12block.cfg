# Deterministic Shared-Memory Middleware: the 12-block graph used for every
# benchmark and replay claim in the README. Two fan-out/fan-in stages, so
# both merge blocks (m1, m2, m3) actually exercise the tick-keyed combine
# logic rather than ever seeing a single unambiguous input.
#
# <id> <name> <source|transform|merge|sink> <in1,in2|-> <out1|->
0  S    source    -           S_t1,S_t2,S_t3,S_t4
1  t1   transform S_t1        t1_m1
2  t2   transform S_t2        t2_m1
3  t3   transform S_t3        t3_m2
4  t4   transform S_t4        t4_m2
5  m1   merge     t1_m1,t2_m1 m1_t5
6  m2   merge     t3_m2,t4_m2 m2_t6
7  t5   transform m1_t5       t5_m3
8  t6   transform m2_t6       t6_m3
9  m3   merge     t5_m3,t6_m3 m3_t7
10 t7   transform m3_t7       t7_sink
11 sink sink      t7_sink     -
