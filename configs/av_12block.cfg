# AV simulation profile: 12 blocks, the same block/edge runtime as
# graph_12block.cfg, but every block runs a driving-simulation kernel and the
# whole graph is driven by a scenario file (scenarios/*.scn).
#
#   scn      scenario clock: [t, accel_cmd, steer_cmd, tick] per tick
#   ego      kinematic bicycle, RK4 at the scenario dt, fans out to 3 sensors
#   a1..a3   scripted traffic agents (waypoints from the scenario file)
#   s1..s3   range/bearing sensors, merge(ego, agent), deterministic noise
#   f1, f2   nearest-object fusion, two levels of fan-in
#   ttc      time-to-collision on the nearest object
#   sink     records the TTC stream
#
# Same column format as graph_12block.cfg plus the optional kernel column:
# <id> <name> <source|transform|merge|sink> <in1,in2|-> <out1,...|-> [kernel]
0  scn  source    -             scn_ego,scn_a1,scn_a2,scn_a3  av_source
1  ego  transform scn_ego       ego_s1,ego_s2,ego_s3          ego_bicycle
2  a1   transform scn_a1        a1_s1                         agent:a1
3  a2   transform scn_a2        a2_s2                         agent:a2
4  a3   transform scn_a3        a3_s3                         agent:a3
5  s1   merge     ego_s1,a1_s1  s1_f1                         sensor:a1
6  s2   merge     ego_s2,a2_s2  s2_f1                         sensor:a2
7  s3   merge     ego_s3,a3_s3  s3_f2                         sensor:a3
8  f1   merge     s1_f1,s2_f1   f1_f2                         nearest
9  f2   merge     f1_f2,s3_f2   f2_ttc                        nearest
10 ttc  transform f2_ttc        ttc_sink                      ttc
11 sink sink      ttc_sink      -                             -
